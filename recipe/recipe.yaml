schema_version: 1

context:
  version: 5.2.0.20250924

package:
  name: types-mock
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/types-mock/types_mock-${{ version }}.tar.gz
  sha256: 953197543b4183f00363e8e626f6c7abea1a3f7a4dd69d199addb70b01b6bb35

build:
  number: 1
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - pip
    script:
      - pip check

  - package_contents:
      site_packages:
        - mock-stubs/__init__.pyi

about:
  summary: Typing stubs for mock
  license: Apache-2.0 AND MIT
  license_file: LICENSE
  homepage: https://github.com/python/typeshed

extra:
  recipe-maintainers:
    - fhoehle
    - conda-forge/mypy
